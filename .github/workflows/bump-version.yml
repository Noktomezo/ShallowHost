name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Type of version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false

      - name: Calculate and apply version
        shell: pwsh
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "(\d+)\.(\d+)\.(\d+)"$') {
            throw 'Could not read a stable SemVer package version from Cargo.toml'
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3]
          switch ($env:BUMP_TYPE) {
            'major' { $major++; $minor = 0; $patch = 0 }
            'minor' { $minor++; $patch = 0 }
            'patch' { $patch++ }
            default { throw "Unsupported bump type: $env:BUMP_TYPE" }
          }
          $version = "$major.$minor.$patch"
          $pattern = [regex]::new('(?m)^version = "\d+\.\d+\.\d+"$')
          $updated = $pattern.Replace($manifest, "version = `"$version`"", 1)
          Set-Content Cargo.toml -Value $updated -NoNewline
          "NEW_VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Update Cargo.lock
        run: cargo metadata --format-version 1 --no-deps

      - name: Ensure automation labels exist
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh label create version-bump --color 5319E7 --description "Automated version bump" --force
          gh label create automated-pr --color BFDADC --description "Created by GitHub Actions" --force

      - name: Create version bump pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          commit-message: "chore: bump version to v${{ env.NEW_VERSION }}"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: "chore/version-bump-v${{ env.NEW_VERSION }}"
          delete-branch: true
          title: "chore: bump version to v${{ env.NEW_VERSION }}"
          body: |
            Bumping ShallowHost to v${{ env.NEW_VERSION }}.

            - Bump type: `${{ inputs.bump_type }}`
            - Updated: `Cargo.toml`, `Cargo.lock`
            - A release tag is created only after the PR build succeeds.
          labels: |
            version-bump
            automated-pr
