name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify release configuration
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "([^"]+)"(?=\r?$)') {
            throw 'Could not read package version from Cargo.toml'
          }
          if ($env:RELEASE_TAG -ne "v$($Matches[1])") {
            throw "Tag $env:RELEASE_TAG does not match Cargo version $($Matches[1])"
          }

      - name: Build release
        run: cargo build --release --package shallow-host-gpui --bin ShallowHost

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.Util.wixext/6.0.2

      - name: Package Windows distributions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $baseName = "ShallowHost-$env:RELEASE_TAG-windows-x86_64"
          New-Item -ItemType Directory -Path dist | Out-Null
          New-Item -ItemType Directory -Path package/ShallowHost | Out-Null
          Copy-Item target/release/ShallowHost.exe package/ShallowHost/ShallowHost.exe
          Copy-Item assets package/ShallowHost/assets -Recurse
          Compress-Archive -Path package/ShallowHost -DestinationPath "dist/$baseName.zip"
          wix build packaging/windows/ShallowHost.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -d Version="$version" `
            -d ExeFile="$((Resolve-Path 'target/release/ShallowHost.exe').Path)" `
            -d AssetsDir="$((Resolve-Path 'assets').Path)" `
            -d IconFile="$((Resolve-Path 'assets/windows/ShallowHost.ico').Path)" `
            -o "dist/$baseName.msi"

      - name: Upload unsigned distributions
        uses: actions/upload-artifact@v4
        with:
          name: shallowhost-windows
          path: dist
          if-no-files-found: error

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    env:
      SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY: RWSeWrBbDqi6SGEfcTvdy+8CgdwKGxVK30mNPRJC953JSPStzZYl2RbU
      SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY: ${{ secrets.SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY }}
      SHALLOWHOST_UPDATE_MINISIGN_PASSWORD: ${{ secrets.SHALLOWHOST_UPDATE_MINISIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: shallowhost-windows
          path: dist

      - name: Validate signing configuration
        run: |
          set -euo pipefail
          : "${SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY:?Configure SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY}"
          : "${SHALLOWHOST_UPDATE_MINISIGN_PASSWORD:?Configure SHALLOWHOST_UPDATE_MINISIGN_PASSWORD}"
          : "${SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY:?Configure SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY}"

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign and package release
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/shallowhost-minisign.key"
          public_key="$SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY"
          umask 077
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY" | tr -d '[:space:]' | base64 -d > "$key_file"
          for artifact in dist/*.msi dist/*.zip; do
            printf '%s\n' "$SHALLOWHOST_UPDATE_MINISIGN_PASSWORD" | \
              minisign -S -m "$artifact" -s "$key_file" -x "$artifact.minisig"
            minisign -V -m "$artifact" -P "$public_key" -x "$artifact.minisig"
          done
          (cd dist && sha256sum *.msi *.zip > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            TODO: replace this placeholder with the release notes before publishing.

            При переходе со старой Tauri-сборки первый GPUI-релиз нужно установить вручную.
            Последующие обновления устанавливаются внутри ShallowHost.
          files: |
            dist/ShallowHost-*.msi
            dist/ShallowHost-*.msi.minisig
            dist/ShallowHost-*.zip
            dist/ShallowHost-*.zip.minisig
            dist/SHA256SUMS
