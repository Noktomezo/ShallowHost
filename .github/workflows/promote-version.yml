name: Promote Version

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'version-bump')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY: RWSeWrBbDqi6SGEfcTvdy+8CgdwKGxVK30mNPRJC953JSPStzZYl2RbU
      SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY: ${{ secrets.SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY }}
      SHALLOWHOST_UPDATE_MINISIGN_PASSWORD: ${{ secrets.SHALLOWHOST_UPDATE_MINISIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate merged version bump
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $pr = gh api "repos/$env:REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if (-not $pr.merged) {
            throw "Pull request $env:PR_NUMBER was not merged"
          }
          if ($pr.head.repo.full_name -ne $env:REPOSITORY) {
            throw 'Version releases may only use branches in this repository'
          }
          if ($pr.head.sha -ne $env:HEAD_SHA) {
            throw "Pull request head changed after its successful build"
          }
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "(\d+\.\d+\.\d+)"(?=\r?$)') {
            throw 'Could not read a stable SemVer package version from Cargo.toml'
          }
          $version = $Matches[1]
          if ($pr.head.ref -ne "chore/version-bump-v$version") {
            throw "Version $version does not match PR branch $($pr.head.ref)"
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Locate successful PR build
        id: build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $response = gh api `
            "repos/$env:REPOSITORY/actions/workflows/pr-build.yml/runs?event=workflow_dispatch&status=completed&head_sha=$env:HEAD_SHA&per_page=100" |
            ConvertFrom-Json
          $run = @($response.workflow_runs | Where-Object { $_.conclusion -eq 'success' }) |
            Sort-Object created_at -Descending |
            Select-Object -First 1
          if ($null -eq $run) {
            throw "No successful PR Build found for $env:HEAD_SHA"
          }
          "run_id=$($run.id)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Download tested distributions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: gh run download "$RUN_ID" --name "ShallowHost-pr-$PR_NUMBER" --dir dist

      - name: Rename release distributions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $sourceBase = "ShallowHost-pr-$env:PR_NUMBER-windows-x86_64"
          $releaseBase = "ShallowHost-v$env:VERSION-windows-x86_64"
          Move-Item -LiteralPath "dist/$sourceBase.zip" -Destination "dist/$releaseBase.zip"
          Move-Item -LiteralPath "dist/$sourceBase.msi" -Destination "dist/$releaseBase.msi"

      - name: Validate signing configuration
        run: |
          set -euo pipefail
          : "${SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY:?Configure SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY}"
          : "${SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY:?Configure SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY}"
          : "${SHALLOWHOST_UPDATE_MINISIGN_PASSWORD:?Configure SHALLOWHOST_UPDATE_MINISIGN_PASSWORD}"

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign release distributions
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/shallowhost-minisign.key"
          umask 077
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY" | tr -d '[:space:]' | base64 -d > "$key_file"
          for artifact in dist/*.msi dist/*.zip; do
            printf '%s\n' "$SHALLOWHOST_UPDATE_MINISIGN_PASSWORD" | \
              minisign -S -m "$artifact" -s "$key_file" -x "$artifact.minisig"
            minisign -V -m "$artifact" -P "$SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY" -x "$artifact.minisig"
          done
          (cd dist && sha256sum *.msi *.zip > SHA256SUMS)

      - name: Create release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)"
          if [[ -n "$existing" && "$existing" != "$MERGE_SHA" ]]; then
            echo "$tag already exists at another commit" >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$MERGE_SHA"
            git push origin "$tag"
          fi

      - name: Create draft release from tested distributions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            TODO: replace this placeholder with the release notes before publishing.

            При переходе со старой Tauri-сборки первый GPUI-релиз нужно установить вручную.
            Последующие обновления устанавливаются внутри ShallowHost.
          files: |
            dist/ShallowHost-*.msi
            dist/ShallowHost-*.msi.minisig
            dist/ShallowHost-*.zip
            dist/ShallowHost-*.zip.minisig
            dist/SHA256SUMS
