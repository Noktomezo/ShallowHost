name: Promote Version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged version bump pull request number
        required: true
        type: string
      head_sha:
        description: Successfully built pull request commit
        required: true
        type: string
      merge_sha:
        description: Commit on main to tag
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      REPOSITORY: ${{ github.repository }}
      SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY: RWSeWrBbDqi6SGEfcTvdy+8CgdwKGxVK30mNPRJC953JSPStzZYl2RbU
      SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY: ${{ secrets.SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY }}
      SHALLOWHOST_UPDATE_MINISIGN_PASSWORD: ${{ secrets.SHALLOWHOST_UPDATE_MINISIGN_PASSWORD }}
    steps:
      - name: Resolve merged version bump
        id: context
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_MERGE_SHA: ${{ inputs.merge_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $prNumber = $env:INPUT_PR_NUMBER
            $headSha = $env:INPUT_HEAD_SHA
            $mergeSha = $env:INPUT_MERGE_SHA
          } else {
            $mergeSha = $env:GITHUB_SHA
            $pulls = gh api `
              -H 'Accept: application/vnd.github+json' `
              "repos/$env:REPOSITORY/commits/$mergeSha/pulls" | ConvertFrom-Json
            $pr = @($pulls | Where-Object {
              $_.merged_at -and 'version-bump' -in @($_.labels.name)
            })[0]
            if ($null -eq $pr) {
              'promote=false' | Out-File $env:GITHUB_OUTPUT -Append
              Write-Output 'Commit is not a merged version bump; nothing to promote.'
              exit 0
            }
            $prNumber = $pr.number
            $headSha = $pr.head.sha
          }
          "head_sha=$headSha" | Out-File $env:GITHUB_OUTPUT -Append
          "merge_sha=$mergeSha" | Out-File $env:GITHUB_OUTPUT -Append
          "pr_number=$prNumber" | Out-File $env:GITHUB_OUTPUT -Append
          'promote=true' | Out-File $env:GITHUB_OUTPUT -Append

      - uses: actions/checkout@v4
        if: steps.context.outputs.promote == 'true'
        with:
          fetch-depth: 0
          ref: ${{ steps.context.outputs.merge_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate merged version bump
        if: steps.context.outputs.promote == 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        shell: pwsh
        run: |
          $pr = gh api "repos/$env:REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if (-not $pr.merged) {
            throw "Pull request $env:PR_NUMBER was not merged"
          }
          if ($pr.head.repo.full_name -ne $env:REPOSITORY) {
            throw 'Version releases may only use branches in this repository'
          }
          if ($pr.head.sha -ne $env:HEAD_SHA) {
            throw 'Pull request head differs from the successfully built commit'
          }
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "(\d+\.\d+\.\d+)"(?=\r?$)') {
            throw 'Could not read a stable SemVer package version from Cargo.toml'
          }
          $version = $Matches[1]
          if ($pr.head.ref -ne "chore/version-bump-v$version") {
            throw "Version $version does not match PR branch $($pr.head.ref)"
          }
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Locate successful PR build
        if: steps.context.outputs.promote == 'true'
        id: build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        shell: pwsh
        run: |
          $response = gh api `
            "repos/$env:REPOSITORY/actions/workflows/pr-build.yml/runs?event=workflow_dispatch&status=completed&head_sha=$env:HEAD_SHA&per_page=100" |
            ConvertFrom-Json
          $run = @($response.workflow_runs | Where-Object { $_.conclusion -eq 'success' }) |
            Sort-Object created_at -Descending |
            Select-Object -First 1
          if ($null -eq $run) {
            throw "No successful PR Build found for $env:HEAD_SHA"
          }
          "run_id=$($run.id)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Download tested distributions
        if: steps.context.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: gh run download "$RUN_ID" --name "ShallowHost-pr-$PR_NUMBER" --dir dist

      - name: Rename release distributions
        if: steps.context.outputs.promote == 'true'
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $sourceBase = "ShallowHost-pr-$env:PR_NUMBER-windows-x86_64"
          $releaseBase = "ShallowHost-v$env:VERSION-windows-x86_64"
          Move-Item -LiteralPath "dist/$sourceBase.zip" -Destination "dist/$releaseBase.zip"
          Move-Item -LiteralPath "dist/$sourceBase.msi" -Destination "dist/$releaseBase.msi"

      - name: Validate signing configuration
        if: steps.context.outputs.promote == 'true'
        run: |
          set -euo pipefail
          : "${SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY:?Configure SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY}"
          : "${SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY:?Configure SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY}"
          : "${SHALLOWHOST_UPDATE_MINISIGN_PASSWORD:?Configure SHALLOWHOST_UPDATE_MINISIGN_PASSWORD}"

      - name: Install minisign
        if: steps.context.outputs.promote == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign release distributions
        if: steps.context.outputs.promote == 'true'
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/shallowhost-minisign.key"
          umask 077
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SHALLOWHOST_UPDATE_MINISIGN_SECRET_KEY" | tr -d '[:space:]' | base64 -d > "$key_file"
          for artifact in dist/*.msi dist/*.zip; do
            printf '%s\n' "$SHALLOWHOST_UPDATE_MINISIGN_PASSWORD" | \
              minisign -S -m "$artifact" -s "$key_file" -x "$artifact.minisig"
            minisign -V -m "$artifact" -P "$SHALLOWHOST_UPDATE_MINISIGN_PUBLIC_KEY" -x "$artifact.minisig"
          done
          (cd dist && sha256sum *.msi *.zip > SHA256SUMS)

      - name: Create updater manifest
        if: steps.context.outputs.promote == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          msi_name="ShallowHost-v${VERSION}-windows-x86_64.msi"
          sha256="$(awk -v name="$msi_name" '$2 == name { print $1 }' dist/SHA256SUMS)"
          if [[ -z "$sha256" ]]; then
            echo "No checksum found for $msi_name" >&2
            exit 1
          fi
          jq -n \
            --arg version "v${VERSION}" \
            --arg notes_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            --arg name "$msi_name" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${msi_name}" \
            --arg signature_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${msi_name}.minisig" \
            --arg sha256 "$sha256" \
            --argjson size "$(stat -c%s "dist/$msi_name")" \
            '{schema_version: 1, version: $version, notes_url: $notes_url, assets: [{name: $name, url: $url, size: $size, sha256: $sha256, signature_url: $signature_url, os: "windows", arch: "x86_64", format: "msi"}]}' \
            > dist/latest.json

      - name: Create release tag
        if: steps.context.outputs.promote == 'true'
        env:
          MERGE_SHA: ${{ steps.context.outputs.merge_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)"
          if [[ -n "$existing" && "$existing" != "$MERGE_SHA" ]]; then
            echo "$tag already exists at another commit" >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git tag "$tag" "$MERGE_SHA"
            git push origin "$tag"
          fi

      - name: Create draft release from tested distributions
        if: steps.context.outputs.promote == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            TODO: replace this placeholder with the release notes before publishing.

            При переходе со старой Tauri-сборки первый GPUI-релиз нужно установить вручную.
            Последующие обновления устанавливаются внутри ShallowHost.
          files: |
            dist/ShallowHost-*.msi
            dist/ShallowHost-*.msi.minisig
            dist/ShallowHost-*.zip
            dist/ShallowHost-*.zip.minisig
            dist/SHA256SUMS
            dist/latest.json
