name: PR Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Version bump pull request number
        required: true
        type: string

concurrency:
  group: pr-build-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'chore/version-bump-v')
    runs-on: windows-latest
    permissions:
      contents: read
      statuses: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Mark dispatched PR build as pending
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f state=pending `
            -f context='PR Build / build' `
            -f description='Windows build is running' `
            -f target_url="$env:RUN_URL"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --package shallow-host-gpui --bin ShallowHost

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.Util.wixext/6.0.2

      - name: Package Windows distributions
        shell: pwsh
        run: |
          $baseName = "ShallowHost-pr-$env:PR_NUMBER-windows-x86_64"
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "([^"]+)"(?=\r?$)') {
            throw 'Could not read package version from Cargo.toml'
          }
          $version = $Matches[1]
          New-Item -ItemType Directory -Path package/ShallowHost | Out-Null
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/ShallowHost.exe package/ShallowHost/ShallowHost.exe
          Copy-Item assets package/ShallowHost/assets -Recurse
          Compress-Archive -Path package/ShallowHost -DestinationPath "dist/$baseName.zip"
          wix build packaging/windows/ShallowHost.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -d Version="$version" `
            -d ExeFile="$((Resolve-Path 'target/release/ShallowHost.exe').Path)" `
            -d AssetsDir="$((Resolve-Path 'assets').Path)" `
            -d IconFile="$((Resolve-Path 'assets/windows/ShallowHost.ico').Path)" `
            -o "dist/$baseName.msi"

      - name: Upload PR build
        uses: actions/upload-artifact@v4
        with:
          name: ShallowHost-pr-${{ env.PR_NUMBER }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

      - name: Dispatch version promotion
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          gh workflow run promote-version.yml `
            --ref main `
            -f "pr_number=$env:PR_NUMBER" `
            -f "head_sha=$env:GITHUB_SHA"

      - name: Publish dispatched PR build result
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f state="$env:RESULT" `
            -f context='PR Build / build' `
            -f description="Windows build finished: $env:RESULT" `
            -f target_url="$env:RUN_URL"
