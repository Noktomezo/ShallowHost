[package]
name = "shallow-host-gpui"
version = "0.3.1"
edition = "2024"
build = "build.rs"
license = "MIT"
repository = "https://github.com/Noktomezo/ShallowHost"
readme = "README.md"

[[bin]]
name = "ShallowHost"
path = "src/main.rs"

[workspace]
resolver = "3"
members = [
    ".",
    "xtask",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
cxx = "1.0.198"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
# Observable GPUI-native updater; pinned so release behaviour is reproducible.
gpui-updater = { git = "https://github.com/AprilNEA/gpui-updater", tag = "v0.0.6", features = ["gpui"] }
rust-i18n = "3.1"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Portable configuration is stored as a human-editable file beside the executable.
toml = "0.9"

[build-dependencies]
cxx-build = "1.0.198"

[target.'cfg(windows)'.dependencies]
# GPUI has no Windows tray/autostart API; these are the focused crates used by Tauri too.
auto-launch = "0.5.0"
raw-window-handle = "0.6.2"
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the original Tauri icon into the Windows executable resource table.
winresource = "0.1"
