[package]
name = "shallow-host-gpui"
version = "1.0.1"
edition = "2024"
build = "build.rs"
license = "MIT"
repository = "https://github.com/Noktomezo/ShallowHost"
readme = "README.md"

[[bin]]
name = "ShallowHost"
path = "src/main.rs"

[workspace]
resolver = "3"
members = [
    ".",
    "tooling/xtask",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
cxx = "1.0.198"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
# Vendored from v0.0.6 with a Windows MSI handoff fix; see tooling/vendor/gpui-updater/README.shallowhost.md.
gpui-updater = { path = "tooling/vendor/gpui-updater", features = ["gpui"] }
rust-i18n = "3.1"
image = "0.25"
rust-embed = { version = "8.7", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Small, established edit-distance implementation for fuzzy plugin search.
strsim = "0.11"
# Unicode grapheme and word boundaries keep the native text input cursor safe.
unicode-segmentation = "1.12"
# Portable configuration is stored as a human-editable file beside the executable.
toml = "0.9"

[build-dependencies]
cxx-build = "1.0.198"

[target.'cfg(windows)'.dependencies]
# GPUI has no Windows tray/autostart API; these are the focused crates used by Tauri too.
auto-launch = "0.5.0"
raw-window-handle = "0.6.2"
tray-icon = "0.24.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the original Tauri icon into the Windows executable resource table.
winresource = "0.1"
