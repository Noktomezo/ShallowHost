entry = [
  "src/main.tsx",
  "src/app/**/*.tsx",
  "src/pages/**/*.tsx",
  "src/widgets/**/*.tsx",
  "src/shared/**/*.ts",
  "src/shared/**/*.tsx",
  "src/entities/**/*.ts",
  "src/entities/**/*.tsx",
  "vite.config.ts",
  "eslint.config.js",
  "doctor.config.ts",
]
ignorePatterns = [
  "**/*.d.ts",
  "dist/**",
  "src-tauri/target/**",
]

[rules]
unused-files = "error"
unused-exports = "warn"
unused-types = "warn"

[duplicates]
mode = "mild"
minTokens = 50
minLines = 5
threshold = 10
